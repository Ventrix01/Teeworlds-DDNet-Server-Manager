name: Build Windows installer

on:
  workflow_dispatch:        # gives you a "Run workflow" button on the Actions tab
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install PyQt5 pyinstaller

      - name: Package the app into one .exe
        run: pyinstaller --onefile --windowed --noconfirm --name ddnet-manager ddnet-manager.py

      - name: Make the Setup wizard
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: DDNet-Server-Manager-Windows
          path: |
            Output/DDNet-Server-Manager-Setup.exe
            dist/ddnet-manager.exe
